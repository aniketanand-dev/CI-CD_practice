name: Node.js CI/CD Local

on:
  push:
    branches:
      - main  # Trigger workflow on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run tests (optional)
      - name: Run tests
        run: npm test || echo "No tests configured"

      # 5️⃣ Build project (optional)
      - name: Build project
        run: npm run build || echo "No build step configured"

      # 6️⃣ Deploy to local folder
      - name: Deploy to local folder
        run: |
          # Create deploy folder if it doesn't exist
          mkdir -p $HOME/CI-CD_practice

          # Copy all files to deploy folder
          rsync -av --exclude='.git' ./ $HOME/CI-CD_practice/

          # Go to deploy folder
          cd $HOME/CI-CD_practice

          # Install production dependencies only
          npm install --production

          # Start or restart app using pm2
          pm2 restart myapp || pm2 start index.js --name myapp
          pm2 save

      # 7️⃣ Optional: list deployed files for verification
      - name: Verify deployment
        run: ls -l $HOME/CI-CD_practice
